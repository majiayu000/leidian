name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run HY regression tests
        run: node --test models/hy/tests/*.test.js
      - name: Check HY JavaScript syntax
        run: find models/hy/js -name '*.js' -exec node --check {} +
      - name: Run score regression tests
        run: node --test models/score-regressions.test.js
      - name: Validate HY metadata
        run: node -e "JSON.parse(require('node:fs').readFileSync('models/hy/meta.json', 'utf8'))"
