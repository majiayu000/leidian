<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雷电</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="hud-left">
        <span id="score-display">分数: 0</span>
      </div>
      <div id="hud-right">
        <span id="lives-display"></span>
        <span id="wave-display">波次: 1</span>
      </div>
    </div>
    <div id="overlay" class="visible">
      <div id="overlay-content">
        <h1 id="overlay-title">雷 电</h1>
        <p id="overlay-subtitle">经典纵版射击</p>
        <div id="overlay-instructions">
          <p>方向键 / WASD — 移动</p>
          <p>自动射击 | 空格 — 炸弹</p>
          <p>鼠标控制也支持</p>
        </div>
        <button id="start-btn">开始游戏</button>
      </div>
    </div>
  </div>
  <script src="js/entities.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
